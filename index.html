<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokeSale v2 — Pokémon marketplace</title>
<style>
:root{--bg:#0a0d12;--panel:#121722;--panel2:#171d2a;--text:#f5f7fb;--muted:#99a3b5;--line:#283141;--accent:#ffcb05;--accent2:#3b82f6;--good:#35d07f;--danger:#ff6678}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(180deg,#080b10,#0d1118 50%,#090c11);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.container{max-width:1180px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(8,11,16,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{height:72px;display:flex;align-items:center;gap:18px}.logo{font-weight:900;font-size:24px;color:var(--accent);letter-spacing:-1px}.logo span{color:#fff}.navsearch{flex:1;max-width:530px}.navsearch input{width:100%;background:#111722;border:1px solid var(--line);border-radius:13px;padding:12px 15px;color:#fff}.navlinks{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--panel2);color:#fff}.btn.primary{background:var(--accent);color:#17130a;font-weight:800}.btn.blue{background:var(--accent2);font-weight:700}.btn.ghost{border:1px solid var(--line)}.btn.small{padding:8px 10px;font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffcb05,#ff7a00);color:#111;font-weight:900}
.hero{padding:58px 0 30px;background:radial-gradient(circle at 15% 0,#26314b 0,transparent 40%),radial-gradient(circle at 85% 20%,#1d2740 0,transparent 35%)}.hero h1{font-size:clamp(38px,6vw,72px);line-height:.98;margin:0 0 15px;letter-spacing:-3px}.hero p{color:var(--muted);font-size:18px;max-width:680px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:18px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select,.filters input{background:var(--panel);border:1px solid var(--line);color:#fff;padding:10px 12px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-bottom:50px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#3b4658}.cardimg{height:230px;background:linear-gradient(145deg,#1a2130,#0f131b);display:grid;place-items:center;position:relative}.cardimg img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:60px}.heart{position:absolute;right:10px;top:10px;border:1px solid #ffffff22;background:#0b0f16cc;color:#fff;border-radius:50%;width:36px;height:36px}.cardbody{padding:14px}.tag{display:inline-block;font-size:11px;color:#b8c1d0;background:#202837;border-radius:7px;padding:4px 7px;margin-bottom:8px}.card h3{margin:2px 0 5px;font-size:17px}.meta{color:var(--muted);font-size:13px}.price{font-size:20px;font-weight:900;margin-top:13px}.seller{display:flex;align-items:center;gap:8px;margin-top:13px;color:#c7cfdd;font-size:13px}
.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;grid-column:1/-1}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.dialog{width:min(650px,100%);max-height:90vh;overflow:auto;background:#111722;border:1px solid var(--line);border-radius:18px;padding:22px}.dialog h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{background:#0c1119;border:1px solid var(--line);color:#fff;border-radius:10px;padding:11px}.field textarea{min-height:100px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.profile{display:grid;grid-template-columns:280px 1fr;gap:22px;margin:34px 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.bigavatar{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffcb05,#ff7a00);color:#111;font-size:30px;font-weight:900}.panel h2{margin:8px 0}.muted{color:var(--muted)}
.orders{display:grid;gap:10px}.order{display:flex;align-items:center;justify-content:space-between;gap:15px;background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:13px}.status{font-size:12px;padding:5px 8px;border-radius:7px;background:#1e293b}.status.good{background:#123f2b;color:#7af0ae}
.chat{display:grid;grid-template-columns:280px 1fr;min-height:600px;margin:30px 0}.convos{border-right:1px solid var(--line);background:var(--panel);border-radius:16px 0 0 16px;overflow:auto}.conv{padding:14px;border-bottom:1px solid var(--line);cursor:pointer}.conv.active{background:#1b2433}.chatbox{background:#101620;border:1px solid var(--line);border-left:0;border-radius:0 16px 16px 0;display:flex;flex-direction:column}.messages{flex:1;padding:18px;overflow:auto;min-height:470px}.msg{max-width:72%;padding:10px 12px;border-radius:13px;background:#1e2736;margin:7px 0}.msg.mine{margin-left:auto;background:#28539a}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.composer input{flex:1;background:#0b1018;border:1px solid var(--line);color:#fff;border-radius:10px;padding:11px}
footer{border-top:1px solid var(--line);padding:35px 0;color:var(--muted)}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.navsearch{display:none}.profile{grid-template-columns:1fr}.chat{grid-template-columns:1fr}.convos{border-radius:16px 16px 0 0;max-height:180px}.chatbox{border-left:1px solid var(--line);border-radius:0 0 16px 16px}}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding-top:35px}.nav{gap:9px}.navlinks .hide-mobile{display:none}.cardimg{height:190px}}
</style>
</head>
<body>
<header><div class="container nav">
  <div class="logo">Poke<span>Sale</span></div>
  <div class="navsearch"><input id="topSearch" placeholder="Søg efter Pokémon, sæt eller sælger…"></div>
  <div class="navlinks" id="navLinks"></div>
</div></header>

<main class="container">
<section class="hero">
  <h1>Køb. Sælg. Saml.</h1>
  <p>En markedsplads bygget til Pokémon-kortsamlere. Find kort, kontakt sælgere og gennemfør handler ét sted.</p>
  <div class="hero-actions"><button class="btn primary" onclick="openSell()">Sælg et kort</button><button class="btn ghost" onclick="document.getElementById('market').scrollIntoView()">Se kort</button></div>
</section>

<section id="market">
  <div class="toolbar">
    <div><h2 style="margin:0">Seneste kort</h2><div class="muted" id="count"></div></div>
    <div class="filters">
      <select id="condition"><option value="">Alle stande</option><option>Near Mint</option><option>Excellent</option><option>Good</option><option>Played</option></select>
      <select id="sort"><option value="newest">Nyeste</option><option value="price_asc">Laveste pris</option><option value="price_desc">Højeste pris</option></select>
    </div>
  </div>
  <div id="grid" class="grid"></div>
</section>

<section id="account" style="display:none"></section>
<section id="chatSection" style="display:none"></section>
<section id="ordersSection" style="display:none"></section>
</main>

<footer><div class="container">PokeSale v2 · Full-stack prototype · Køb-flow er demo og bruger ikke rigtige betalinger.</div></footer>

<div id="modal" class="modal"><div class="dialog" id="dialog"></div></div>

<script>
let me=null, listings=[], currentConversation=null, chatTimer=null;

const money = c => new Intl.NumberFormat("da-DK",{style:"currency",currency:"DKK"}).format(c/100);
const initials = n => (n||"?").slice(0,1).toUpperCase();
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function api(url,opt={}) {
  const r=await fetch(url,{headers:{"Content-Type":"application/json",...(opt.headers||{})},...opt});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||"Noget gik galt.");
  return data;
}
function toast(msg){alert(msg)}
function openModal(html){document.getElementById("dialog").innerHTML=html;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

async function loadMe(){
  const d=await api("/api/me"); me=d.user; renderNav();
}
function renderNav(){
  const n=document.getElementById("navLinks");
  if(me) n.innerHTML=`<button class="btn ghost hide-mobile" onclick="showOrders()">Mine handler</button><button class="btn ghost hide-mobile" onclick="showChat()">Chat</button><button class="btn" onclick="showProfile()"><span class="avatar">${initials(me.display_name)}</span></button>`;
  else n.innerHTML=`<button class="btn ghost" onclick="openLogin()">Log ind</button><button class="btn primary" onclick="openRegister()">Opret bruger</button>`;
}
function openLogin(){
 openModal(`<h2>Log ind</h2><form onsubmit="login(event)"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Luk</button><button class="btn primary">Log ind</button></div></form>`);
}
function openRegister(){
 openModal(`<h2>Opret bruger</h2><form onsubmit="register(event)"><div class="formgrid">
<div class="field"><label>Navn</label><input id="displayName" required></div><div class="field"><label>Brugernavn</label><input id="username" required></div>
<div class="field full"><label>Email</label><input id="email" type="email" required></div><div class="field full"><label>Password</label><input id="password" type="password" minlength="8" required></div>
</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Luk</button><button class="btn primary">Opret konto</button></div></form>`);
}
async function login(e){e.preventDefault();try{await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:email.value,password:password.value})});closeModal();await loadMe();toast("Du er logget ind.");}catch(x){toast(x.message)}}
async function register(e){e.preventDefault();try{await api("/api/auth/register",{method:"POST",body:JSON.stringify({email:email.value,password:password.value,username:username.value,displayName:displayName.value})});closeModal();await loadMe();toast("Konto oprettet.");}catch(x){toast(x.message)}}
async function logout(){await api("/api/auth/logout",{method:"POST"});me=null;renderNav();location.hash="";location.reload()}

async function loadListings(){
 const q=document.getElementById("topSearch").value;
 const condition=document.getElementById("condition").value;
 const sort=document.getElementById("sort").value;
 const d=await api(`/api/listings?q=${encodeURIComponent(q)}&condition=${encodeURIComponent(condition)}&sort=${sort}`);
 listings=d.listings; renderListings();
}
function renderListings(){
 document.getElementById("count").textContent=`${listings.length} kort`;
 const g=document.getElementById("grid");
 if(!listings.length){g.innerHTML=`<div class="empty">Ingen kort matchede din søgning.</div>`;return}
 g.innerHTML=listings.map(l=>`
 <article class="card">
  <div class="cardimg">${l.image_url?`<img src="${esc(l.image_url)}" alt="${esc(l.name)}">`:`<div class="placeholder">🃏</div>`}
   ${me?`<button class="heart" onclick="favorite(${l.id},event)">${l.is_favorite?"♥":"♡"}</button>`:""}
  </div>
  <div class="cardbody">
   <span class="tag">${esc(l.condition)}</span><span class="tag">${esc(l.language)}</span>
   <h3>${esc(l.name)}</h3><div class="meta">${esc(l.set_name)} · ${esc(l.rarity)}</div>
   <div class="price">${money(l.price_cents)}</div>
   <div class="seller"><span class="avatar" style="width:26px;height:26px;font-size:11px">${initials(l.display_name)}</span>@${esc(l.username)}</div>
   <div style="display:flex;gap:7px;margin-top:13px"><button class="btn blue small" onclick="viewListing(${l.id})">Se kort</button>${me&&me.id!==l.seller_id?`<button class="btn small" onclick="buy(${l.id})">Køb</button>`:""}</div>
  </div>
 </article>`).join("");
}
async function favorite(id,e){e.stopPropagation();if(!me)return openLogin();await api(`/api/listings/${id}/favorite`,{method:"POST"});loadListings()}
async function viewListing(id){
 const d=await api(`/api/listings/${id}`), l=d.listing;
 openModal(`<div style="display:flex;justify-content:space-between;gap:10px"><h2>${esc(l.name)}</h2><button class="btn" onclick="closeModal()">×</button></div>
 <div class="cardimg" style="height:330px;border-radius:12px;margin-bottom:16px">${l.image_url?`<img src="${esc(l.image_url)}" alt="">`:`<div class="placeholder">🃏</div>`}</div>
 <div class="tag">${esc(l.condition)}</div> <div class="tag">${esc(l.set_name)}</div> <div class="tag">${esc(l.rarity||"Kort")}</div>
 <h2>${money(l.price_cents)}</h2><p class="muted">${esc(l.description||"Ingen beskrivelse.")}</p>
 <div class="panel"><b>Sælger</b><p>@${esc(l.username)} · ${esc(l.display_name)}</p><p class="muted">${esc(l.bio||"")}</p></div>
 <div class="modal-actions">${me&&me.id!==l.seller_id?`<button class="btn ghost" onclick="messageSeller(${l.id})">Skriv til sælger</button><button class="btn primary" onclick="buy(${l.id})">Køb kortet</button>`:`<button class="btn" onclick="closeModal()">Luk</button>`}</div>`);
}
async function buy(id){
 if(!me){closeModal();return openLogin()}
 if(!confirm("Opret ordre? Dette er en demo: der trækkes ikke rigtige penge."))return;
 try{const d=await api("/api/orders",{method:"POST",body:JSON.stringify({listingId:id})});closeModal();toast("Ordre oprettet #"+d.order.id+". Betaling er demo.");showOrders();}catch(e){toast(e.message)}
}
function openSell(){
 if(!me)return openLogin();
 openModal(`<h2>Sælg et kort</h2><form onsubmit="createListing(event)"><div class="formgrid">
 <div class="field"><label>Kortnavn</label><input id="lname" required placeholder="Charizard ex"></div>
 <div class="field"><label>Sæt</label><input id="lset" required placeholder="151"></div>
 <div class="field"><label>Sjældenhed</label><input id="rarity" placeholder="Illustration Rare"></div>
 <div class="field"><label>Stand</label><select id="lcondition"><option>Near Mint</option><option>Excellent</option><option>Good</option><option>Played</option></select></div>
 <div class="field"><label>Sprog</label><select id="language"><option>EN</option><option>JP</option><option>DK</option><option>DE</option></select></div>
 <div class="field"><label>Pris i DKK</label><input id="price" type="number" min=".01" step=".01" required></div>
 <div class="field full"><label>Beskrivelse</label><textarea id="desc" placeholder="Fortæl om kortets stand…"></textarea></div>
 <div class="field full"><label>Kortbillede</label><input id="image" type="file" accept="image/*"></div>
 </div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Annullér</button><button class="btn primary">Publicér kort</button></div></form>`);
}
async function createListing(e){
 e.preventDefault();
 try{
  let imageUrl="";
  const file=document.getElementById("image").files[0];
  if(file){const fd=new FormData();fd.append("image",file);const r=await fetch("/api/upload",{method:"POST",body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error);imageUrl=d.url}
  await api("/api/listings",{method:"POST",body:JSON.stringify({name:lname.value,setName:lset.value,rarity:rarity.value,condition:lcondition.value,language:language.value,price:price.value,description:desc.value,imageUrl})});
  closeModal();loadListings();toast("Kortet er publiceret.");
 }catch(x){toast(x.message)}
}
async function messageSeller(id){
 if(!me){closeModal();return openLogin()}
 try{const d=await api("/api/conversations",{method:"POST",body:JSON.stringify({listingId:id})});closeModal();showChat(d.conversation.id)}catch(e){toast(e.message)}
}
async function showProfile(){
 if(!me)return openLogin();
 document.getElementById("account").style.display="block";document.getElementById("market").style.display="none";document.getElementById("chatSection").style.display="none";document.getElementById("ordersSection").style.display="none";
 document.getElementById("account").innerHTML=`<div class="profile"><div class="panel"><div class="bigavatar">${initials(me.display_name)}</div><h2>${esc(me.display_name)}</h2><div class="muted">@${esc(me.username)}</div><p class="muted">${esc(me.bio||"Ingen bio endnu.")}</p><button class="btn primary" onclick="editProfile()">Redigér profil</button><button class="btn" style="margin-left:6px" onclick="logout()">Log ud</button></div><div class="panel"><h2>Din PokeSale-profil</h2><p class="muted">Her kan du senere få vurderinger, salgsstatistik, samlerniveau og verificering.</p></div></div>`;
}
function editProfile(){
 openModal(`<h2>Redigér profil</h2><form onsubmit="saveProfile(event)"><div class="field"><label>Visningsnavn</label><input id="pname" value="${esc(me.display_name)}"></div><div class="field"><label>Brugernavn</label><input id="puser" value="${esc(me.username)}"></div><div class="field"><label>Bio</label><textarea id="pbio">${esc(me.bio||"")}</textarea></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Luk</button><button class="btn primary">Gem</button></div></form>`);
}
async function saveProfile(e){e.preventDefault();try{const d=await api("/api/me",{method:"PUT",body:JSON.stringify({displayName:pname.value,username:puser.value,bio:pbio.value})});me=d.user;closeModal();renderNav();showProfile()}catch(x){toast(x.message)}}

async function showOrders(){
 if(!me)return openLogin();
 document.getElementById("account").style.display="none";document.getElementById("market").style.display="none";document.getElementById("chatSection").style.display="none";document.getElementById("ordersSection").style.display="block";
 const d=await api("/api/orders");
 document.getElementById("ordersSection").innerHTML=`<div style="padding:30px 0"><h2>Mine handler</h2><p class="muted">Køb og salg samlet ét sted.</p><div class="orders">${d.orders.length?d.orders.map(o=>`<div class="order"><div><b>#${o.id} · ${esc(o.name)}</b><div class="muted">${money(o.amount_cents)} · ${o.buyer_id===me.id?"Købt":"Solgt"} · @${esc(o.buyer_id===me.id?o.seller_username:o.buyer_username)}</div></div><div><span class="status ${o.status==="received"?"good":""}">${esc(o.status)}</span>${o.seller_id===me.id&&o.status==="paid_demo"?` <button class="btn small" onclick="updateOrder(${o.id},'shipped')">Markér sendt</button>`:""}${o.buyer_id===me.id&&o.status==="shipped"?` <button class="btn small" onclick="updateOrder(${o.id},'received')">Modtaget</button>`:""}</div></div>`).join(""):`<div class="empty">Ingen handler endnu.</div>`}</div></div>`;
}
async function updateOrder(id,status){try{await api(`/api/orders/${id}`,{method:"PATCH",body:JSON.stringify({status})});showOrders()}catch(e){toast(e.message)}}

async function showChat(id=null){
 if(!me)return openLogin();
 document.getElementById("account").style.display="none";document.getElementById("market").style.display="none";document.getElementById("ordersSection").style.display="none";document.getElementById("chatSection").style.display="block";
 const d=await api("/api/conversations");
 document.getElementById("chatSection").innerHTML=`<div class="chat"><div class="convos" id="convos">${d.conversations.length?d.conversations.map(c=>`<div class="conv ${String(c.id)===String(id)?"active":""}" onclick="openConversation(${c.id})"><b>${esc(c.listing_name||"Samtale")}</b><div class="muted">${esc(c.buyer_id===me.id?"Sælger: @"+c.seller_username:"Køber: @"+c.buyer_username)}</div><small class="muted">${esc(c.last_message||"Ingen beskeder")}</small></div>`).join(""):`<div class="empty" style="margin:15px">Ingen samtaler.</div>`}</div><div class="chatbox" id="chatbox"><div class="messages"><div class="muted">Vælg en samtale.</div></div></div></div>`;
 if(id)openConversation(id);else if(d.conversations[0])openConversation(d.conversations[0].id);
}
async function openConversation(id){
 currentConversation=id;
 const d=await api(`/api/conversations/${id}/messages`);
 const box=document.getElementById("chatbox");
 box.innerHTML=`<div style="padding:15px;border-bottom:1px solid var(--line)"><b>${esc(d.conversation.listing_id?"Samtale om kortet":"Samtale")}</b></div><div class="messages" id="messages">${d.messages.map(m=>`<div class="msg ${m.sender_id===me.id?"mine":""}">${esc(m.body)}<div style="font-size:10px;opacity:.65;margin-top:4px">${esc(m.display_name)}</div></div>`).join("")||`<div class="muted">Ingen beskeder endnu.</div>`}</div><form class="composer" onsubmit="sendMessage(event)"><input id="messageInput" placeholder="Skriv en besked…" autocomplete="off"><button class="btn primary">Send</button></form>`;
 const msgs=document.getElementById("messages");msgs.scrollTop=msgs.scrollHeight;
}
async function sendMessage(e){e.preventDefault();const input=document.getElementById("messageInput");if(!input.value.trim())return;try{await api(`/api/conversations/${currentConversation}/messages`,{method:"POST",body:JSON.stringify({body:input.value})});input.value="";openConversation(currentConversation)}catch(x){toast(x.message)}}

document.getElementById("topSearch").addEventListener("input",()=>loadListings());
document.getElementById("condition").addEventListener("change",()=>loadListings());
document.getElementById("sort").addEventListener("change",()=>loadListings());
(async()=>{await loadMe();await loadListings()})();
</script>
</body>
</html>
